[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-asset-allocation-framework"
version = "0.1.0"
description = "Research framework for portfolio allocation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "jugaad-data",
    "yfinance",
    "pyarrow",
    "pytest",
    "ruff",
    "black",
]

[tool.setuptools.packages.find]
include = ["data*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]